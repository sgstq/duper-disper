[package]
name = "duper-disper"
version = "0.2.0"
edition = "2021"
description = "Fast push-to-talk voice transcription and refinement tool"

# The binary is a GUI tray app and needs all three default features. Declaring
# them as required-features means `cargo build --no-default-features` cleanly
# skips the binary (and just builds the library) instead of failing to compile.
[[bin]]
name = "duper-disper"
path = "src/main.rs"
required-features = ["ui", "audio-capture", "local-stt"]

[features]
default = ["ui", "audio-capture", "local-stt"]
ui = ["dep:tray-icon", "dep:eframe", "dep:winit"]
audio-capture = ["dep:cpal"]
local-stt = ["dep:whisper-rs"]

[dependencies]
# Audio capture (optional, needs ALSA)
cpal = { version = "0.15", optional = true }
hound = "3.5"

# Whisper transcription (optional, needs whisper.cpp)
whisper-rs = { version = "0.13", optional = true }

# LLM refinement (OpenAI-compatible API client)
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking", "multipart"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# System tray (optional, needs GTK)
tray-icon = { version = "0.19", optional = true }

# Cross-platform clipboard
arboard = "3"
enigo = "0.2"
rdev = "0.5"

# UI toolkit for overlay / settings (optional, needs GTK/Pango)
eframe = { version = "0.30", optional = true }
winit = { version = "0.30", optional = true }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
toml = "0.8"
dirs = "6"

# Misc
anyhow = "1"
base64 = "0.22"

# Windows-specific APIs (input simulation, context capture)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_System_Com",
    "Win32_Graphics_Gdi",
    "Win32_UI_Accessibility",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
] }
screenshots = "0.8"

# macOS-specific APIs (menu-bar app lifecycle, AppKit event pump, active-window
# context). Pinned to the objc2 0.6 / objc2-*-0.3 family that tray-icon 0.19
# already compiles, so we reuse those crates instead of adding another modern
# objc2 copy. (Older objc2 0.5.x may still appear in the lockfile via unrelated
# deps like cocoa/core-graphics; that's separate.) CoreFoundation /
# CoreGraphics / Accessibility are accessed via direct C FFI in src/macos.rs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSDate",
    "NSRunLoop",
    "NSThread",
    "NSObjCRuntime",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSResponder",
    "NSEvent",
    "NSRunningApplication",
    "NSWorkspace",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package.metadata.bundle]
name = "Duper Disper"
identifier = "com.sgstq.duper-disper"
short_description = "Fast push-to-talk voice transcription and refinement tool"
long_description = "A native desktop app for push-to-talk voice transcription, refinement, and text insertion."
icon = ["assets/icon.png"]
category = "Productivity"
