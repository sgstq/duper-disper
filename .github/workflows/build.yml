name: Build & Release

on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump for the release (main/master only)'
        type: choice
        options: [patch, minor, major]
        default: patch

env:
  CARGO_TERM_COLOR: always

# Serialize release-producing runs per ref so two pushes to main can't race in
# `prepare`/`release` and compute the same version or clobber each other's
# release. cancel-in-progress is false so an in-flight release is never killed.
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

# Releases are owned by this workflow: git tags are the single source of truth
# for the version. On every push to main/master the version is auto-bumped from
# the latest v* tag (patch by default; choose minor/major via "Run workflow"),
# the build is stamped with that version, and a GitHub Release + tag are created.
# The version in Cargo.toml is only a local/dev baseline — CI overrides it.
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      is_release: ${{ steps.version.outputs.IS_RELEASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        shell: bash
        run: |
          git fetch --tags --force >/dev/null 2>&1 || true

          # Latest existing release version (strip leading "v"); default 0.0.0.
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -V | tail -n1)
          [ -z "$LATEST" ] && LATEST="0.0.0"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"

          # Apply a bump level to MAJOR/MINOR/PATCH.
          bump() {
            case "$1" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              *)     PATCH=$((PATCH + 1)) ;;
            esac
          }

          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/master" ]; then
            IS_RELEASE=true
            BUMP="${{ github.event.inputs.bump }}"
            BUMP="${BUMP:-patch}"
            bump "$BUMP"
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
            # On collision (e.g. a re-run after the tag was created) keep bumping
            # the SAME component the user asked for, so a repeated major stays a
            # major (3.0.0, 4.0.0, ...) rather than degrading to a patch.
            while git rev-parse "v${VERSION}" >/dev/null 2>&1; do
              bump "$BUMP"
              VERSION="${MAJOR}.${MINOR}.${PATCH}"
            done
          else
            # Non-release builds (PRs, claude/** branches): mark as a pre-release
            # of the next patch, disambiguated by short SHA, so artifacts are
            # never mistaken for a published release. The "g" prefix keeps the
            # identifier valid semver even if the SHA is all digits.
            IS_RELEASE=false
            SHORT=$(git rev-parse --short=7 HEAD)
            VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))-dev.g${SHORT}"
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "IS_RELEASE=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION (release=$IS_RELEASE, latest tag was v$LATEST)"

  build-windows:
    runs-on: windows-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version
        shell: bash
        run: |
          sed -E "s/^version = \"[^\"]*\"/version = \"${{ needs.prepare.outputs.version }}\"/" Cargo.toml > Cargo.toml.tmp && mv Cargo.toml.tmp Cargo.toml
          grep -m1 '^version' Cargo.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Build (release)
        run: cargo build --release

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build installer
        shell: pwsh
        run: |
          Copy-Item "target\release\duper-disper.exe" "installer\duper-disper.exe" -Force
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=${{ needs.prepare.outputs.version }} installer\duper-disper.nsi
          New-Item -ItemType Directory -Force -Path "installer\output" | Out-Null
          Move-Item "installer\duper-disper-setup.exe" "installer\output\duper-disper-${{ needs.prepare.outputs.version }}-setup.exe" -Force

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "target\release\duper-disper.exe" -DestinationPath "installer\output\duper-disper-${{ needs.prepare.outputs.version }}-portable.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: duper-disper-windows
          path: installer/output/*

  build-macos:
    runs-on: macos-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version
        shell: bash
        run: |
          sed -E "s/^version = \"[^\"]*\"/version = \"${{ needs.prepare.outputs.version }}\"/" Cargo.toml > Cargo.toml.tmp && mv Cargo.toml.tmp Cargo.toml
          grep -m1 '^version' Cargo.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-cargo-

      - name: Install native build tools
        run: brew install cmake

      - name: Install bundler
        run: cargo install cargo-bundle --locked

      - name: Build macOS app bundle
        run: cargo bundle --release

      - name: Inject Info.plist permissions
        shell: bash
        run: |
          PLIST="target/release/bundle/osx/Duper Disper.app/Contents/Info.plist"
          plist_set() {  # $1=entry  $2=type  $3=value
            /usr/libexec/PlistBuddy -c "Add ${1} ${2} ${3}" "${PLIST}" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set ${1} ${3}" "${PLIST}"
          }
          # Required: without a microphone usage string macOS terminates the app
          # the moment it touches the mic.
          plist_set ":NSMicrophoneUsageDescription" string \
            "Duper Disper needs the microphone for push-to-talk dictation."
          # Used when reading the active app/window for refinement context.
          plist_set ":NSAppleEventsUsageDescription" string \
            "Duper Disper reads the active app and window to improve transcription."
          # Run as a menu-bar agent (no Dock icon).
          plist_set ":LSUIElement" bool true
          echo "----- Final Info.plist -----"
          /usr/libexec/PlistBuddy -c "Print" "${PLIST}"

      - name: Package app bundle
        shell: bash
        run: |
          mkdir -p installer/output
          ditto -c -k --sequesterRsrc --keepParent \
            "target/release/bundle/osx/Duper Disper.app" \
            "installer/output/duper-disper-${{ needs.prepare.outputs.version }}-macos-app.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: duper-disper-macos
          path: installer/output/*

  release:
    runs-on: ubuntu-latest
    needs: [prepare, build-windows, build-macos]
    if: needs.prepare.outputs.is_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: duper-disper-windows
          path: release-artifacts

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: duper-disper-macos
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.prepare.outputs.version }}
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
